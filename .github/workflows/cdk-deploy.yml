name: cdk-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: cdk
      - run: npm run build
        working-directory: cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          # Deploys (CloudFront especially) can run past the 1h default session.
          # Requires the role's max session duration raised to 4h in IAM.
          role-duration-seconds: 14400
      - run: |
          {
            echo "SITE_DOMAIN=$(aws ssm get-parameter --name /shenvigo/env/site-domain --query Parameter.Value --output text)"
            echo "API_DOMAIN=$(aws ssm get-parameter --name /shenvigo/env/api-domain --query Parameter.Value --output text)"
            echo "HOSTED_ZONE_ID=$(aws ssm get-parameter --name /shenvigo/env/hosted-zone-id --query Parameter.Value --output text)"
            echo "HOSTED_ZONE_NAME=$(aws ssm get-parameter --name /shenvigo/env/hosted-zone-name --query Parameter.Value --output text)"
            echo "SITE_WWW_DOMAIN=$(aws ssm get-parameter --name /shenvigo/env/site-www-domain --query Parameter.Value --output text 2>/dev/null || true)"
          } >> $GITHUB_ENV
      - run: |
          {
            echo "TABLE_NAME=$(aws ssm get-parameter --name /shenvigo/data/table-name --query Parameter.Value --output text)"
            echo "TABLE_ARN=$(aws ssm get-parameter --name /shenvigo/data/table-arn --query Parameter.Value --output text)"
            echo "VPC_ID=$(aws ssm get-parameter --name /shenvigo/network/vpc-id --query Parameter.Value --output text)"
            echo "PRIVATE_SUBNET_IDS=$(aws ssm get-parameter --name /shenvigo/network/private-subnet-ids --query Parameter.Value --output text)"
          } >> $GITHUB_ENV
      - run: npx cdk deploy --all --require-approval never
        working-directory: cdk
